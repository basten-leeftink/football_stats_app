<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Buitenveldert 7 Stats</title>
  <link
  rel="icon"
  type="image/png"
  href="{{ url_for('static', filename='favicon.png') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f4f4f5; }
    header { background: #0b3cff; color: white; padding: 1rem; }
    nav a { color: white; margin-right: 1rem; text-decoration: none; font-weight: 500; }
    main { padding: 1rem; max-width: 960px; margin: 0 auto; }
    h1, h2 { margin-top: 0; }
    form { display: grid; gap: 0.5rem; margin-bottom: 1rem; background: white; padding: 1rem; border-radius: 0.5rem; }
    label { font-size: 0.9rem; }
    input, select { padding: 0.4rem; border-radius: 0.25rem; border: 1px solid #d4d4d8; }
    button { padding: 0.6rem 1rem; border-radius: 0.4rem; border: none; background: #0b3cff; color: white; font-weight: 600; cursor: pointer; }
    button:hover { background: #385ffc; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; background: white; }
    th, td { padding: 0.5rem; border-bottom: 1px solid #e4e4e7; text-align: left; font-size: 0.9rem; }
    th { background: #f9fafb; }
    .stats-table tbody tr:nth-child(odd) {
      background-color: #f3f4f6; /* light grey */
    }
    .stats-table tbody tr:nth-child(even) {
      background-color: #ffffff; /* white */
    }
    .tag { display: inline-block; padding: 0.2rem 0.4rem; border-radius: 999px; background: #e0f2f1; font-size: 0.75rem; margin-right: 0.25rem; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{{ url_for('index') }}">Overview</a>
      <a href="{{ url_for('players') }}">Players</a>
      <a href="{{ url_for('matches') }}">Matches</a>
      <a href="{{ url_for('trainings') }}">Trainings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      function makeSortable(tableId) {
        const table = document.getElementById(tableId);
        if (!table) return;
  
        const headers = table.querySelectorAll('thead th');
        const tbody = table.querySelector('tbody');
        const directions = Array(headers.length).fill('asc');
  
        headers.forEach((header, index) => {
          header.style.cursor = 'pointer';
  
          header.addEventListener('click', () => {
            const rows = Array.from(tbody.querySelectorAll('tr'));
            const dir = directions[index];
            const multiplier = dir === 'asc' ? 1 : -1;
  
            rows.sort((a, b) => {
              const aText = a.children[index].textContent.trim();
              const bText = b.children[index].textContent.trim();
  
              const aNum = parseFloat(aText);
              const bNum = parseFloat(bText);
  
              if (!isNaN(aNum) && !isNaN(bNum)) {
                return multiplier * (aNum - bNum);
              }
              return multiplier * aText.localeCompare(
                bText,
                undefined,
                { numeric: true }
              );
            });
  
            rows.forEach(row => tbody.appendChild(row));
            directions[index] = dir === 'asc' ? 'desc' : 'asc';
          });
        });
      }
  
      makeSortable('playerStatsTable');
      makeSortable('matchesTable');
      makeSortable('trainingsTable');
    });
  </script>
</body>
</html>
